name: CI

# Validation only — no deployment. Runs the same gates as the local Husky hooks,
# on a server where they can't be bypassed, so red code can't merge.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit + eslint --max-warnings 0 + prettier --check + coverage.
      # The same command the pre-push hook runs — but `git push --no-verify`
      # skips the hook and nothing skips this. Hooks are for fast feedback; CI
      # is the actual gate.
      - name: Validate
        run: npm run validate

      # Fail on any high/critical advisory in the production dependency tree.
      # Scoped to --omit=dev so build/CLI-only transitives (e.g. the shadcn
      # scaffolding tool) don't gate shipped code. Closes the freshness gap the
      # other gates don't cover.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Coverage ratchet on the business-logic dirs (thresholds in vitest.config).
      # A drop below the committed floor fails the build, so untested logic can't
      # merge into src/lib or src/services.
      - name: Test coverage floor
        run: npm run test:coverage

      # Production build (webpack) + bundle-size budget guard.
      # Fails if shared/total client JS exceeds the committed baseline + tolerance.
      - name: Build & check bundle size
        run: npm run bundle:build-check

      # CycloneDX SBOM of the production dependency tree — supply-chain inventory
      # for audits. Non-blocking (won't fail the build); kept as a downloadable
      # artifact for 90 days.
      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # Cross-repo contract drift.
  #
  # `contracts/*.json` is generated by the backend (`make contracts`). This job
  # fetches the current copy from the backend repo and fails if it differs from
  # the one vendored here, so a backend rename cannot land silently and leave
  # this app sending the old param names.
  #
  # Requires `BACKEND_REPO` (owner/name) and, for a private backend, a
  # `CONTRACTS_TOKEN` secret with read access. Without them the job reports the
  # vendored copy as unverified rather than failing the build — an unconfigured
  # template should not be red out of the box.
  contracts:
    name: Contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the backend's generated contracts
        id: fetch
        env:
          BACKEND_REPO: ${{ vars.BACKEND_REPO }}
          GH_TOKEN: ${{ secrets.CONTRACTS_TOKEN || github.token }}
        run: |
          if [ -z "$BACKEND_REPO" ]; then
            echo "::warning::BACKEND_REPO is not set — skipping the drift check."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/backend-contracts
          for file in envelope.json list_params.json permissions.json; do
            gh api "repos/$BACKEND_REPO/contents/contracts/$file" \
              --jq '.content' | base64 -d > "/tmp/backend-contracts/$file"
          done
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Compare against the vendored copy
        if: steps.fetch.outputs.skipped == 'false'
        run: |
          if ! diff -ru contracts /tmp/backend-contracts \
               --exclude=README.md; then
            echo "::error::Contracts have drifted. Run \`make contracts\` in the"
            echo "::error::backend, copy contracts/*.json here, and fix what breaks."
            exit 1
          fi
          echo "Contracts are in sync."

  # Secret-scanning gate — Gitleaks over the full history. Catches committed
  # API keys/tokens/creds before they merge. Own job on the official image.
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/gitleaks/gitleaks:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit on the ref, not just HEAD.
          fetch-depth: 0

      - name: Gitleaks scan
        run: gitleaks detect --source=. --redact --verbose

  # SAST gate — Semgrep over src/ with curated JS/React/Next.js/OWASP/secrets
  # rulesets (the bandit-equivalent for this frontend). Runs in its own job on
  # the official image so it can't be bypassed locally and doesn't slow validate.
  security-scan:
    name: Security scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan
        run: >-
          semgrep scan
          --config p/javascript
          --config p/react
          --config p/nextjs
          --config p/owasp-top-ten
          --config p/secrets
          --error --metrics=off src
